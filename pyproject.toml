[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-caldav-server"
version = "0.1.0"
description = "CalDAV server that syncs with Plane Project Management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Natesh Narain", email = "nnaraindev@gmail.com"}
]
keywords = ["caldav", "plane", "project-management", "calendar", "todo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "radicale>=3.0.0",
    "caldav>=1.3.0",
    "icalendar>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
plane-caldav-server = "plane_caldav_server.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/plane-caldav-server"
Repository = "https://github.com/yourusername/plane-caldav-server"
Issues = "https://github.com/yourusername/plane-caldav-server/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["plane_caldav_server"]

[tool.setuptools.package-data]
plane_caldav_server = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
